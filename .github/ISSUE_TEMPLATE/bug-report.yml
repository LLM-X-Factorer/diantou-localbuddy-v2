name: LocalBuddy Bug Report
description: Report a reproducible LocalBuddy desktop or runtime problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## This report is public

        Review every field before submitting. Do not paste prompts, source documents,
        artifact contents, local paths, credentials, API keys, raw event logs, or other
        private material. LocalBuddy's in-app report flow only prefills a public-safe summary.

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the visible behavior without private task content.
      placeholder: The run stopped while preparing a safe checkpoint.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: The run should have recovered or explained the next safe action.

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Use a minimal example and remove private names, paths, and content.
      placeholder: |
        1. Start a local research run.
        2. Wait for the checkpoint step.
        3. Observe the failure state.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Public-safe environment
      description: Prefilled by LocalBuddy when you use Report a problem.
      render: text
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Public-safe trace summary
      description: Counts, controlled failure categories, event types, and a duplicate signature only.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots are public too. Inspect and crop them before uploading.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public data review
      options:
        - label: I reviewed this public report and removed private data, credentials, prompts, paths, and task artifacts.
          required: true
