name: LocalBuddy Bug Report
description: Report a LocalBuddy desktop or runtime problem with a public-safe trace
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## This report is public

        Review the prefilled summary before submitting. Do not paste prompts, source documents,
        artifact contents, local paths, credentials, API keys, raw event logs, or other
        private material. LocalBuddy's in-app flow generates the public-safe summary and trace;
        it never uploads the raw Run trace or submits the Issue for you.

  - type: textarea
    id: problem
    attributes:
      label: Public-safe problem summary
      description: Automatically generated from the selected Run when you report from LocalBuddy.
      placeholder: LocalBuddy recorded a failed Run with a controlled failure classification.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Public-safe environment
      description: Prefilled by LocalBuddy when you use Report a problem.
      render: text
    validations:
      required: true

  - type: textarea
    id: trace
    attributes:
      label: Public-safe trace summary
      description: Counts, controlled failure categories, event types, and a duplicate signature only.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots are public too. Inspect and crop them before uploading.
