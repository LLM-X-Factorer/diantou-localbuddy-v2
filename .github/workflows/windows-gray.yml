name: windows-synthetic-gray

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      fault_matrix:
        description: Exercise 401, 429, 500, disconnect, and timeout handling
        type: boolean
        required: true
        default: true
      soak_cycles:
        description: Additional installed-app restart cycles (0-20)
        type: number
        required: true
        default: 5

permissions:
  contents: read

concurrency:
  group: windows-synthetic-gray-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installed-gray:
    name: Installed app synthetic gray
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'windows-gray')
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      LOCALBUDDY_BUILD_CHANNEL: canary
      LOCALBUDDY_BUILD_SHA: ${{ github.sha }}
      LOCALBUDDY_GRAY_FAULT_MATRIX: ${{ (github.event_name != 'workflow_dispatch' || inputs.fault_matrix) && '1' || '0' }}
      LOCALBUDDY_GRAY_SOAK_CYCLES: ${{ github.event_name == 'workflow_dispatch' && inputs.soak_cycles || '5' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      - name: Run complete Windows runtime contracts
        run: pnpm check
      - name: Block high-severity production dependency advisories
        run: pnpm audit --prod --audit-level high
      - name: Build Windows installer and portable ZIP
        run: pnpm make:win
      - name: Install and exercise LocalBuddy with a local deterministic Provider
        run: pnpm verify:windows-gray-installer
      - name: Upload sanitized Windows gray evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-windows-synthetic-gray-${{ github.run_id }}
          path: .localbuddy/windows-gray/win32-installer/**
          if-no-files-found: warn
          retention-days: 30
