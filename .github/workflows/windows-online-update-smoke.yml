name: windows-online-update-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  previous-stable-to-latest:
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Resolve latest and previous stable Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/invoke-github-cli-with-retry.ps1
          $packageJson = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($packageJson.version)"
          $latestTag = Invoke-LocalBuddyGitHubCli -Description "resolve latest stable Release" -Arguments @(
            "release", "view", "--repo", $env:GITHUB_REPOSITORY, "--json", "tagName", "--jq", ".tagName"
          )
          if ($latestTag -ne $expectedTag) {
            throw "Default-branch package version $expectedTag is not the latest stable Release ($latestTag)"
          }
          $releaseJson = Invoke-LocalBuddyGitHubCli -Description "list stable Releases" -Arguments @(
            "release", "list", "--repo", $env:GITHUB_REPOSITORY, "--limit", "100", "--json", "tagName,isDraft,isPrerelease,publishedAt"
          )
          $releases = $releaseJson | ConvertFrom-Json
          $previous = @($releases | Where-Object {
            -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $latestTag -and $_.tagName -match '^v\d+\.\d+\.\d+$'
          } | Select-Object -First 1)
          if ($previous.Count -ne 1) { throw "Could not resolve a previous stable Release" }
          Write-Host "Resolved online update smoke: $($previous[0].tagName) -> $latestTag"
          New-Item -ItemType Directory -Force previous-release-online | Out-Null
          Invoke-LocalBuddyGitHubCli -Description "download previous stable Setup" -Arguments @(
            "release", "download", $previous[0].tagName, "--repo", $env:GITHUB_REPOSITORY,
            "--pattern", "LocalBuddy-*-Setup.exe", "--dir", "previous-release-online"
          ) | Out-Null
          $setups = @(Get-ChildItem previous-release-online -File -Filter "LocalBuddy-*-Setup.exe")
          if ($setups.Count -ne 1) { throw "Expected exactly one previous stable Setup" }
          "LOCALBUDDY_ONLINE_BASE_SETUP=$($setups[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upgrade previous stable through the first-party GitHub Release feed
        shell: pwsh
        run: |
          $feedRoot = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
          pwsh -NoLogo -NoProfile -File scripts/verify-windows-installer-upgrade.ps1 -BaseSetup $env:LOCALBUDDY_ONLINE_BASE_SETUP -FeedRoot $feedRoot
      - name: Upload sanitized online-update evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-windows-online-update-evidence-manual
          path: .localbuddy/online-update-smoke/windows/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
