name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Windows full check
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check

  test-macos:
    name: macOS regression check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check

  windows-installed-smoke:
    name: Windows Setup clean first launch
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows installer and portable ZIP
        run: pnpm make:win
      - name: Install Windows Setup and verify clean first launch without Provider credentials
        run: pnpm verify:first-run-windows-installer
      - name: Upload installed clean first-launch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-installed-clean-first-launch-windows-2025
          path: .localbuddy/first-run-smoke/win32-installer/**
          if-no-files-found: warn
          retention-days: 14
      - name: Stage Windows distributables on main only
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-assets | Out-Null
          Get-ChildItem .localbuddy/forge-out/make -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".zip") } |
            ForEach-Object { Copy-Item $_.FullName -Destination ci-assets/$($_.Name) }
      - name: Upload Windows distributables on main only
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-windows-main
          path: ci-assets/**
          if-no-files-found: error
          retention-days: 7
