name: release-windows-first

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      LOCALBUDDY_GRAY_FAULT_MATRIX: "1"
      LOCALBUDDY_GRAY_SOAK_CYCLES: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check
      - name: Build Windows installer and portable ZIP
        run: pnpm make:win
      - name: Install and exercise LocalBuddy with a local deterministic Provider
        run: pnpm verify:windows-gray-installer
      - name: Upload sanitized installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localbuddy-windows-gray-evidence-${{ github.ref_name }}
          path: .localbuddy/windows-gray/win32-installer/**
          if-no-files-found: warn
          retention-days: 90
      - name: Collect release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $assets = Get-ChildItem .localbuddy/forge-out/make -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".zip") }
          if ($assets.Count -lt 2) {
            throw "Expected both a Windows installer and portable ZIP"
          }
          foreach ($asset in $assets) {
            Copy-Item $asset.FullName -Destination release-assets/$($asset.Name)
          }
          $checksumLines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumPath = Join-Path (Resolve-Path release-assets) "SHA256SUMS-windows.txt"
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            $checksumPath,
            (($checksumLines -join "`n") + "`n"),
            $utf8WithoutBom
          )
      - uses: actions/upload-artifact@v4
        with:
          name: localbuddy-windows-${{ github.ref_name }}
          path: release-assets/**
          if-no-files-found: error

  publish-release:
    needs: [windows-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: localbuddy-windows-${{ github.ref_name }}
          path: release-assets
      - name: Verify release version and Windows checksums
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi
          cd release-assets
          sha256sum --check SHA256SUMS-windows.txt
      - name: Publish Windows-first GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --generate-notes --title "LocalBuddy $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" "${release_flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
