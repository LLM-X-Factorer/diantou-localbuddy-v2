name: release-windows-first

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      previous_version: ${{ steps.previous_stable.outputs.version }}
    env:
      LOCALBUDDY_GRAY_FAULT_MATRIX: "1"
      LOCALBUDDY_GRAY_SOAK_CYCLES: "3"
      LOCALBUDDY_BUILD_CHANNEL: "stable"
      LOCALBUDDY_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check
      - name: Build Windows installer and portable ZIP
        run: pnpm make:win
      - name: Install and exercise LocalBuddy with a local deterministic Provider
        run: pnpm verify:windows-gray-installer
      - name: Download previous stable Setup
        id: previous_stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force previous-release | Out-Null
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tag)) { throw "Could not resolve previous stable Release" }
          "version=$($tag.TrimStart('v'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "LocalBuddy-*-Setup.exe" --dir previous-release
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous stable Setup" }
          $setups = @(Get-ChildItem previous-release -File -Filter "LocalBuddy-*-Setup.exe")
          if ($setups.Count -ne 1) { throw "Expected exactly one previous stable Setup" }
          "LOCALBUDDY_UPGRADE_BASE_SETUP=$($setups[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify previous stable to current stable in-place upgrade
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/verify-windows-installer-upgrade.ps1 -BaseSetup $env:LOCALBUDDY_UPGRADE_BASE_SETUP
      - name: Upload sanitized installed-app evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-windows-gray-evidence-${{ github.ref_name }}
          path: .localbuddy/windows-gray/win32-installer/**
          if-no-files-found: warn
          retention-days: 90
      - name: Upload sanitized installed-upgrade evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-windows-upgrade-evidence-${{ github.ref_name }}
          path: .localbuddy/upgrade-smoke/windows/**
          if-no-files-found: warn
          retention-days: 90
      - name: Collect release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $assets = Get-ChildItem .localbuddy/forge-out/make -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".zip", ".nupkg") -or $_.Name -eq "RELEASES" }
          if (@($assets | Where-Object { $_.Extension -eq ".exe" }).Count -ne 1 -or
              @($assets | Where-Object { $_.Extension -eq ".zip" }).Count -ne 1 -or
              @($assets | Where-Object { $_.Extension -eq ".nupkg" -and $_.Name -like "*-full.nupkg" }).Count -ne 1 -or
              @($assets | Where-Object { $_.Name -eq "RELEASES" }).Count -ne 1) {
            throw "Expected Setup, portable ZIP, full nupkg, and RELEASES metadata"
          }
          foreach ($asset in $assets) {
            Copy-Item $asset.FullName -Destination release-assets/$($asset.Name)
          }
          $checksumLines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumPath = Join-Path (Resolve-Path release-assets) "SHA256SUMS-windows.txt"
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            $checksumPath,
            (($checksumLines -join "`n") + "`n"),
            $utf8WithoutBom
          )
      - name: Verify and publish Windows-first GitHub Release from verified Windows bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-windows-release.mjs

  online-update-smoke:
    needs: [windows-release]
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download previous stable Setup
        shell: pwsh
        env:
          PREVIOUS_VERSION: ${{ needs.windows-release.outputs.previous_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force previous-release-online | Out-Null
          gh release download "v$env:PREVIOUS_VERSION" --repo $env:GITHUB_REPOSITORY --pattern "LocalBuddy-*-Setup.exe" --dir previous-release-online
          if ($LASTEXITCODE -ne 0) { throw "Could not download previous stable Setup" }
          $setups = @(Get-ChildItem previous-release-online -File -Filter "LocalBuddy-*-Setup.exe")
          if ($setups.Count -ne 1) { throw "Expected exactly one previous stable Setup" }
          "LOCALBUDDY_ONLINE_BASE_SETUP=$($setups[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upgrade previous stable through the first-party GitHub Release feed
        shell: pwsh
        run: |
          $feedRoot = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
          pwsh -NoLogo -NoProfile -File scripts/verify-windows-installer-upgrade.ps1 -BaseSetup $env:LOCALBUDDY_ONLINE_BASE_SETUP -FeedRoot $feedRoot
      - name: Upload sanitized online-update evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: localbuddy-windows-online-update-evidence-${{ github.ref_name }}
          path: .localbuddy/online-update-smoke/windows/**
          if-no-files-found: warn
          retention-days: 90
