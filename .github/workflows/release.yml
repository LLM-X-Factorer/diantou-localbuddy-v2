name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm build:core
      - name: Run platform-neutral contracts
        run: >-
          node --test
          dist/test/credential-store.test.js
          dist/test/deepseek-provider.test.js
          dist/test/openai-provider.test.js
          dist/test/platform-contract.test.js
          dist/test/process-shared-provider.test.js
          dist/test/provider-connection.test.js
          dist/test/provider-factory.test.js
          dist/test/run-request-store.test.js
          dist/test/scheduler.test.js
          dist/test/tool-runtime.test.js
          dist/test/trust-policy.test.js
          dist/test/update-manifest.test.js
          dist/test/workspace-process-lock.test.js
      - name: Build Windows installer and portable ZIP
        run: pnpm make:win
      - name: Verify clean first launch without Provider credentials
        run: pnpm verify:first-run-package
      - name: Upload clean first-launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localbuddy-clean-first-launch-windows-${{ github.ref_name }}
          path: .localbuddy/first-run-smoke/windows/**
          if-no-files-found: warn
      - name: Collect release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $assets = Get-ChildItem .localbuddy/forge-out/make -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".zip") }
          if ($assets.Count -lt 2) {
            throw "Expected both a Windows installer and portable ZIP"
          }
          foreach ($asset in $assets) {
            Copy-Item $asset.FullName -Destination release-assets/$($asset.Name)
          }
          $checksumLines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumPath = Join-Path (Resolve-Path release-assets) "SHA256SUMS-windows.txt"
          $utf8WithoutBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText(
            $checksumPath,
            (($checksumLines -join "`n") + "`n"),
            $utf8WithoutBom
          )
      - uses: actions/upload-artifact@v4
        with:
          name: localbuddy-windows-${{ github.ref_name }}
          path: release-assets/**
          if-no-files-found: error

  linux-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm typecheck
      - run: pnpm build:core
      - name: Run platform-neutral contracts
        run: >-
          node --test
          dist/test/credential-store.test.js
          dist/test/deepseek-provider.test.js
          dist/test/openai-provider.test.js
          dist/test/platform-contract.test.js
          dist/test/process-shared-provider.test.js
          dist/test/provider-connection.test.js
          dist/test/provider-factory.test.js
          dist/test/run-request-store.test.js
          dist/test/scheduler.test.js
          dist/test/tool-runtime.test.js
          dist/test/trust-policy.test.js
          dist/test/update-manifest.test.js
          dist/test/workspace-process-lock.test.js
      - name: Build Linux DEB
        run: pnpm make:linux
      - name: Collect release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t assets < <(find .localbuddy/forge-out/make -type f -name '*.deb' -print | sort)
          if [[ ${#assets[@]} -lt 1 ]]; then
            echo "Expected a Linux DEB" >&2
            exit 1
          fi
          cp "${assets[@]}" release-assets/
          (
            cd release-assets
            sha256sum -- *.deb > SHA256SUMS-linux.txt
          )
      - uses: actions/upload-artifact@v4
        with:
          name: localbuddy-linux-${{ github.ref_name }}
          path: release-assets/**
          if-no-files-found: error

  publish-release:
    needs: [windows-release, linux-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: localbuddy-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true
      - name: Verify release version and checksums
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          expected_tag="v${package_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag" >&2
            exit 1
          fi
          cd release-assets
          sha256sum --check SHA256SUMS-windows.txt
          sha256sum --check SHA256SUMS-linux.txt
      - name: Publish synchronized GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "LocalBuddy $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
